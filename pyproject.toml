[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb"
version = "0.1.0"
description = "College basketball power ratings and FanDuel spread/moneyline bets, validated walk-forward"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "pyarrow>=14.0", "requests>=2.31", "openpyxl>=3.1"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -W ignore"
